<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>News Signal Paper Desk · Login</title>
<style>html,body{height:100%;margin:0}body{font:15px system-ui,sans-serif;background:#07121c;color:#d9e5ed;display:grid;place-items:center}main{width:min(92vw,370px);background:#101e2a;border:1px solid #28465b;padding:30px;border-radius:14px;box-shadow:0 20px 80px #0008}h1{font-size:23px;margin:0 0 12px}p{color:#9bacb8;line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:7px;font-size:15px}input{background:#091823;border:1px solid #35556a;color:white}button{margin-top:14px;background:#42a4d6;color:#001824;font-weight:700;border:0;cursor:pointer}#error{color:#f18f9b;min-height:1.3em}</style>
</head><body><main><h1>News Signal · Paper Desk</h1><p>Verified 09:00 IST research, live read-only market prices and simulated trades. No broker orders.</p><form id="login"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password" required/><button>Sign in</button></form><p id="error" role="alert"></p></main>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(!r.ok)throw Error('Invalid password or service unavailable');location.replace('/');}catch(x){error.textContent=x.message;}});</script></body></html>
