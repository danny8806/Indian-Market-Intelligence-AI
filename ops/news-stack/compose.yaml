# Private, research-only news infrastructure.
# Neither PostgreSQL nor the collector exposes a host port.
name: market-news-db

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 768m
    environment:
      POSTGRES_DB: market_news
      POSTGRES_USER: news_admin
      POSTGRES_PASSWORD: ${NEWS_ADMIN_PASSWORD:?Set server-only database admin password}
      NEWS_WRITER_PASSWORD: ${NEWS_WRITER_PASSWORD:?Set server-only news writer password}
      NEWS_READER_PASSWORD: ${NEWS_READER_PASSWORD:?Set server-only news reader password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-news-db.sh:/docker-entrypoint-initdb.d/10-init-news-db.sh:ro
    networks: [news_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_admin -d market_news"]
      interval: 15s
      timeout: 5s
      retries: 12

  collector:
    image: market-news-db-collector
    build:
      context: ../..
      dockerfile: ops/news-stack/Dockerfile
    profiles: [jobs]
    cpus: 1.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_DATABASE_URL: "postgresql+psycopg://news_writer:${NEWS_WRITER_PASSWORD}@postgres:5432/market_news"
      ENABLE_OPENAI_WEB_RESEARCH: "false"
      ENABLE_PAID_NEWS_APIS: "false"
      ENABLE_PUBLIC_GITHUB_INBOX_PULL: "false"
      NEWS_AGENT_INBOX: /app/cli-inbox
      NEWS_CODEX_HOME: /home/newsbot/.news-codex
      CODEX_HOME: /home/newsbot/.news-codex
      NEWS_CODEX_DAILY_CALLS: ${NEWS_CODEX_DAILY_CALLS:-48}
      SERPER_API_KEY: ""
      TZ: Asia/Kolkata
    volumes:
      - news_archive:/app/news_collector/data
      - codex_auth:/home/newsbot/.news-codex
      - cli_inbox:/app/cli-inbox
    networks: [news_private, news_egress]
    logging:
      options:
        max-size: 10m
        max-file: '3'

networks:
  news_private:
    name: market-news-private
    internal: true
  news_egress: {}

volumes:
  postgres_data: {}
  news_archive: {}
  codex_auth: {}
  cli_inbox: {}
