name: NIFTY 500 overnight news collector (research only)

on:
  push:
    branches: [main]
    paths:
      - 'news_collector/*.py'
      - 'news_collector/*.json'
      - 'news_collector/requirements.txt'
      - 'news_collector/chatgpt_inbox/*.json'
      - '.github/workflows/overnight-news-collector.yml'
  workflow_dispatch:
    inputs:
      session_date:
        description: 'Target session YYYY-MM-DD, blank = infer from IST clock'
        required: false
        type: string
  schedule:
    # UTC -> IST. Schedules are only active on the repository default branch.
    - cron: '17,37,57 * * * *' # 24/7, 20-minute cloud fallback (GitHub scheduling can be delayed)
    - cron: '40 10 * * 1-5'   # 16:10 IST
    - cron: '40 14 * * 1-5'   # 20:10 IST
    - cron: '40 18 * * 0-4'   # 00:10 IST next weekday
    - cron: '40 22 * * 0-4'   # 04:10 IST next weekday
    - cron: '40 1 * * 1-5'    # 07:10 IST
    - cron: '5 3 * * 1-5'     # 08:35 IST
    - cron: '12 3 * * 1-5'    # 08:42 IST
    - cron: '18 3 * * 1-5'    # 08:48 IST
    - cron: '28 3 * * 1-5'    # 08:58 IST
    - cron: '35 3 * * 1-5'    # 09:05 IST

permissions:
  contents: write

concurrency:
  group: overnight-news-collector-${{ github.ref }}
  cancel-in-progress: false # Finish current batch before the next one; do not cancel collected evidence.

jobs:
  fetch-research-news:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight free-source dependencies
        run: python -m pip install -r news_collector/requirements.txt
      - name: Offline collector regression tests
        run: python -m unittest discover -s news_collector -p 'test_*.py' -v
      - name: Run all configured public news sources, no broker access
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          SERPER_API_KEY: '' # No key-based/paid search in the 20-minute collector.
          # Paid/keyed providers require BOTH opt-in variable and individual secret.
          ENABLE_PAID_NEWS_APIS: 'false' # No paid news APIs without explicit future change.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWDATA_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.engine --session-date "$SESSION_DATE"
          else
            python -m news_collector.engine
          fi
      - name: Optional cost-capped OpenAI web search discovery
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          ENABLE_OPENAI_WEB_RESEARCH: 'false' # ChatGPT subscription schedule handles AI discovery.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_NEWS_MODEL: ${{ vars.OPENAI_NEWS_MODEL }}
          OPENAI_MAX_SEARCHES_PER_DAY: ${{ vars.OPENAI_MAX_SEARCHES_PER_DAY }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.openai_web_discovery --session-date "$SESSION_DATE"
          else
            python -m news_collector.openai_web_discovery
          fi
      - name: Import ChatGPT scheduled discovery inbox (no API key)
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.chatgpt_inbox_import --session-date "$SESSION_DATE"
          else
            python -m news_collector.chatgpt_inbox_import
          fi
      - name: Extract bounded text from public NSE/BSE PDFs and flag potential source gaps
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.enrich --session-date "$SESSION_DATE" --max-docs 20
          else
            python -m news_collector.enrich --max-docs 20
          fi
      - name: Build point-in-time evidence preview (NEVER a trading signal)
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.candidates --session-date "$SESSION_DATE"
          else
            python -m news_collector.candidates
          fi
      - name: Sync evidence and health to optional persistent news database
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
        shell: bash
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.db_store --session-date "$SESSION_DATE"
          else
            python -m news_collector.db_store
          fi
      - name: Commit reproducible research evidence only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news_collector/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive overnight public financial-news source results'
            # Concurrent source-code changes must not trigger a rebase conflict
            # in regenerated coverage.json and events.jsonl.
            # The current run owns its news data; upstream code changes are merged.
            git pull --no-rebase -X ours origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload per-source coverage report as an artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-news-coverage-${{ github.run_id }}
          path: |
            news_collector/data/*/coverage.json
            news_collector/data/*/source_gap_audit.json
            news_collector/data/*/enrichment_summary.json
            news_collector/data/*/candidate_preview.json
          if-no-files-found: ignore
          retention-days: 14
