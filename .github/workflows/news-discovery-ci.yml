name: News discovery regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'news_collector/**'
      - '.github/workflows/news-discovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install -r news_collector/requirements.txt
      - name: Test news collector without external network or API keys
        run: python -m unittest discover -s news_collector -p 'test_*.py' -v
