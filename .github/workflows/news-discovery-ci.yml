name: News discovery regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'news_collector/**'
      - '.github/workflows/news-discovery-ci.yml'
      - '.github/workflows/deploy-news-vps.yml'
      - 'ops/news-stack/**'
      - 'ops/deploy_news_vps.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NEWS_ADMIN_PASSWORD: test-admin-only-for-ci
      NEWS_WRITER_PASSWORD: test-writer-only-for-ci
      NEWS_READER_PASSWORD: test-reader-only-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install -r news_collector/requirements.txt
      - name: Test news collector without external network or API keys
        run: python -m unittest discover -s news_collector -p 'test_*.py' -v
      - name: Verify no syntax errors in isolated VPS stack
        run: |
          bash -n ops/deploy_news_vps.sh
          bash -n ops/news-stack/activate-news-vps.sh
          sh -n ops/news-stack/init-news-db.sh
          sh -n ops/news-stack/start-news-worker.sh
          python -m compileall -q news_collector
          docker compose -p market-news-ci -f ops/news-stack/compose.yaml config -q
      - name: Integration smoke-test real private PostgreSQL roles
        run: |
          docker compose -p market-news-ci -f ops/news-stack/compose.yaml up -d postgres
          ok=0
          for attempt in $(seq 1 45); do
            roles="$(docker compose -p market-news-ci -f ops/news-stack/compose.yaml exec -T postgres \
              psql -U news_admin -d market_news -Atqc \
              "select count(*) from pg_roles where rolname in ('news_writer','news_reader')" 2>/dev/null || true)"
            if [[ "$roles" == "2" ]]; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == "1" ]] || { echo "Postgres writer/reader roles were not initialized"; exit 4; }
          echo "PASS: isolated database booted with separate writer and reader."
      - name: Remove temporary database containers and test volumes
        if: always()
        run: docker compose -p market-news-ci -f ops/news-stack/compose.yaml down -v --remove-orphans || true
