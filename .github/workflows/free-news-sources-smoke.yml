name: Free Indian financial-news source audit (read-only)

on:
  push:
    branches: [feature/free-news-sources-smoke-20261106]
    paths: [.github/workflows/free-news-sources-smoke.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public news sources without credentials or broker access
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, email.utils, json, re, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import Counter
          from zoneinfo import ZoneInfo
          IST=ZoneInfo('Asia/Kolkata')
          sources=[
            ('NSE announcements RSS','rss','https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml'),
            ('NSE financial results RSS','rss','https://nsearchives.nseindia.com/content/RSS/Financial_Results.xml'),
            ('NSE board meetings RSS','rss','https://nsearchives.nseindia.com/content/RSS/Board_Meetings.xml'),
            ('NSE corporate actions RSS','rss','https://nsearchives.nseindia.com/content/RSS/Corporate_action.xml'),
            ('BSE announcements RSS','rss','https://www.bseindia.com/data/xml/announcements.xml'),
            ('SEBI RSS','rss','https://www.sebi.gov.in/sebirss.xml'),
            ('Zerodha Pulse RSS','rss','https://pulse.zerodha.com/feed.php?n=100'),
            ('Mint markets RSS','rss','https://www.livemint.com/rss/marketsRSS'),
            ('Mint companies RSS','rss','https://www.livemint.com/rss/companiesRSS'),
            ('Mint industry RSS','rss','https://www.livemint.com/rss/industryRSS'),
            ('Economic Times top RSS','rss','https://economictimes.indiatimes.com/rssfeedsdefault.cms'),
            ('Business Standard latest RSS','rss','https://www.business-standard.com/rss/latest.rss'),
            ('Business Standard markets RSS','rss','https://www.business-standard.com/rss/markets-106.rss'),
            ('Moneycontrol RSS','rss','https://www.moneycontrol.com/rss/latestnews.xml'),
            ('BusinessLine RSS','rss','https://www.thehindubusinessline.com/feeder/default.rss'),
            ('NDTV News RSS','rss','https://feeds.feedburner.com/ndtvnews-latest'),
            ('Financial Express legacy RSS','rss','https://www.financialexpress.com/feed/'),
            ('Google News RSS','rss','https://news.google.com/rss/search?q=India+NSE+BSE+results+orders+when%3A1d&hl=en-IN&gl=IN&ceid=IN%3Aen'),
            ('GDELT DOC API','api','https://api.gdeltproject.org/api/v2/doc/doc?query=%22India%22+%22quarterly+results%22&mode=artlist&format=json&maxrecords=50&timespan=24h'),
            ('Zerodha Pulse web','html','https://pulse.zerodha.com/'),
            ('NSE announcements web','html','https://www.nseindia.com/companies-listing/corporate-filings-announcements'),
            ('Business Standard BSE filings','html','https://www.business-standard.com/markets/bse-announcement'),
            ('Reuters India news','html','https://www.reuters.com/world/india/'),
            ('Business Today Markets','html','https://www.businesstoday.in/markets'),
            ('News18 Business','html','https://www.news18.com/business/'),
            ('BSE announcements web','html','https://www.bseindia.com/corporates/ann.html'),
            ('RBI releases','html','https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx'),
            ('SEBI releases web','html','https://www.sebi.gov.in/media/press-releases.html'),
            ('NDTV Profit markets','html','https://www.ndtvprofit.com/markets'),
            ('Moneycontrol stocks','html','https://www.moneycontrol.com/news/business/stocks/'),
            ('Business Standard markets','html','https://www.business-standard.com/markets'),
            ('Financial Express markets','html','https://www.financialexpress.com/market/'),
            ('Mint markets web','html','https://www.livemint.com/market'),
            ('Economic Times markets web','html','https://economictimes.indiatimes.com/markets'),
            ('CNBC TV18 markets web','html','https://www.cnbctv18.com/market/'),
            ('Hindu BusinessLine markets','html','https://www.thehindubusinessline.com/markets/'),
          ]
          def parse_rss(blob):
              root=ET.fromstring(blob)
              rt=root.tag.rsplit('}',1)[-1].lower()
              if rt not in ('rss','rdf','feed'):
                  raise ValueError('Not RSS/Atom: '+rt)
              it=[e for e in root.iter() if e.tag.rsplit('}',1)[-1].lower() in ('item','entry')]
              first=[]
              for e in it[:4]:
                  t=next(((c.text or '').strip() for c in e if c.tag.rsplit('}',1)[-1].lower()=='title'),'')
                  first.append(t[:120])
              return len(it),first,it
          def probe(x):
              name,typ,url=x
              result=dict(source=name,type=typ,url=url)
              req=urllib.request.Request(url,headers={'User-Agent':'IndianFinancialNewsSourceAudit/1.0','Accept':'application/xml,text/xml,application/rss+xml,text/html,application/json,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=16) as response:
                      body=response.read(14000000)
                      result.update(http=response.status,final_url=response.url,content_type=response.headers.get('content-type',''),bytes=len(body))
                  if typ=='rss':
                      try:
                          n,s,entries=parse_rss(body)
                          start=datetime.datetime(2026,11,5,15,tzinfo=IST)
                          end=datetime.datetime(2026,11,6,9,tzinfo=IST)
                          within=unknown=0
                          for item in entries:
                              pub=next(((c.text or '').strip() for c in item if c.tag.rsplit('}',1)[-1].lower() in ('pubdate','published','updated','date')),'')
                              try:
                                  t=email.utils.parsedate_to_datetime(pub)
                                  if t is None: t=datetime.datetime.fromisoformat(pub.replace('Z','+00:00'))
                                  if t.tzinfo is None: raise ValueError('no timezone')
                                  if start<=t.astimezone(IST)<end: within+=1
                              except Exception: unknown+=1
                          result.update(status='RSS_OK' if n else 'RSS_EMPTY',items=n,sample_titles=s,
                                        window_overnight_items=within,missing_or_invalid_date=unknown)
                      except Exception as err: result.update(status='NOT_RSS_XML',error=str(err)[:150])
                  elif typ=='api':
                      try:
                          d=json.loads(body)
                          if isinstance(d,dict) and isinstance(d.get('articles'),list):
                              result.update(status='API_OK',items=len(d['articles']),sample_titles=[z.get('title','')[:120] for z in d['articles'][:4]])
                          else: result.update(status='API_BAD_RESPONSE',sample=str(d)[:160])
                      except Exception as err: result.update(status='API_ERROR',error=str(err)[:150])
                  else:
                      # HTML headline candidates are NOT guaranteed finance news.
                      html=body.decode('utf-8','replace')
                      n=len(re.findall(r'<h[234]\b',html,re.I))
                      result.update(status='HTML_OK' if '<html' in html.lower() or n else 'NOT_HTML',heading_elements=n)
              except urllib.error.HTTPError as err:
                  result.update(status='HTTP_'+str(err.code),http=err.code,error=str(err)[:160])
              except Exception as err:
                  result.update(status='NETWORK_OR_PARSE_ERROR',error=(type(err).__name__+': '+str(err))[:240])
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as exe:
              rows=list(exe.map(probe,sources))
          report={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'run_context':'GitHub Actions ubuntu-latest; read-only, unauthenticated endpoints',
                  'date_note':'Source connectivity smoke test, NOT 3pm-9am complete crawl or timestamp verification',
                  'sources':rows,'status_counts':dict(Counter(x['status'] for x in rows))}
          p=Path('news_audit');p.mkdir(exist_ok=True)
          (p/'source_access_2026-11-06.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('TOTAL SOURCES',len(rows),'STATUS SUMMARY',report['status_counts'])
          for r in rows: print(r['source'],r['status'],r.get('http'),r.get('items',r.get('heading_elements','')),r.get('error',''))
          PY
      - name: Save read-only source audit to this feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_audit/source_access_2026-11-06.json
          git commit -m "Record public financial-news source connectivity audit"
          git push origin HEAD:feature/free-news-sources-smoke-20261106
