name: Freeze research candidate pool before 09:00 IST (no orders)

on:
  schedule:
    # 08:55 and 08:58 IST, weekdays. Scheduled starts may be delayed.
    - cron: '25 3 * * 1-5'
    - cron: '28 3 * * 1-5'
  workflow_dispatch:
    inputs:
      session_date:
        description: 'YYYY-MM-DD target regular cash session (blank = current IST)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: immutable-research-candidate-snapshot
  cancel-in-progress: false

jobs:
  freeze-if-eligible:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-matching dependencies, no model or broker
        run: python -m pip install -r news_collector/requirements.txt
      - name: Freeze only with fresh verified source inventory before 09:00
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          if [ -n "$SESSION_DATE" ]; then
            python -m news_collector.candidates --freeze --session-date "$SESSION_DATE"
          else
            python -m news_collector.candidates --freeze
          fi
      - name: Create-only publish (no SHA = cannot overwrite an existing snapshot)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(news_collector/data/*/candidate_snapshot.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No eligible pre-09:00 frozen candidate snapshot. Fail closed."
            exit 0
          fi
          for file in "${files[@]}"; do
            path="$file"
            data="$(base64 -w0 "$path")"
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="Freeze immutable pre-market candidate research snapshot" \
              -f branch="main" -f content="$data"; then
              echo "Created immutable snapshot $path"
            else
              echo "Snapshot already exists or create-only request failed: $path"
              # Do not retry with SHA, do not update/overwrite a frozen snapshot.
            fi
          done
