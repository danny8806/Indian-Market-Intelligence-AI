name: Structured financial evidence and candidate learner tests (research only)

on:
  push:
    branches: [feature/structured-financial-evidence-candidate-learning-20261106]
    paths:
      - 'news_collector/**'
      - 'learning/**'
      - '.github/workflows/structured-news-learning-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-news-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests-and-snapshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only Python dependencies
        run: |
          python -m pip install -r news_collector/requirements.txt
          python -m pip install -r requirements-learning.txt
      - name: Test original collector plus finance-facts and freeze gates
        run: python -m unittest discover -s news_collector -p 'test_*.py' -v
      - name: Test candidate outcome labels and training readiness
        run: python -m unittest discover -s learning -p 'test_candidate_learning.py' -v
      - name: Build research preview from original archived source data
        run: python -m news_collector.candidates --session-date 2026-11-09
      - name: Probe real NSE 6-Nov-2026 public end-of-day bhavcopy (diagnostic only)
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date
          from learning.nse_bhavcopy import fetch_bhavcopy
          try:
              stocks, url = fetch_bhavcopy(date(2026, 11, 6))
              print("OFFICIAL_NSE_EOD_WORKING:", len(stocks), "symbols, source:", url)
          except Exception as exc:
              print("OFFICIAL_NSE_EOD_UNAVAILABLE:", type(exc).__name__, str(exc)[:450])
              # Network/source restrictions are not a unit-test failure.
          PY
      - name: Challenger must not train on insufficient history
        run: python -m learning.train_candidates
      - name: Export preview for manual inspection (never live signals)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-candidate-preview-${{ github.run_id }}
          path: news_collector/data/2026-11-09/candidate_preview.json
          if-no-files-found: ignore
          retention-days: 7
