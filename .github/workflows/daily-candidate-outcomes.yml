name: Grade frozen NIFTY 500 news candidates after close (research only)

# Retired automatic path: the VPS is the sole production scheduler.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-research-learning
  cancel-in-progress: false

jobs:
  label-and-challenger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoring and challenger libraries
        run: |
          python -m pip install -r news_collector/requirements.txt
          python -m pip install -r requirements-learning.txt
      - name: Validate no-lookahead candidate scoring tests
        run: python -m unittest discover -s learning -p test_candidate_learning.py -v
      - name: Label entire frozen candidate pool from official EOD report
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          day="$SESSION_DATE"
          if [ -z "$day" ]; then
            day="$(TZ=Asia/Kolkata date +%F)"
          fi
          python -m learning.candidate_outcomes --session-date "$day"
      - name: Compare all official NSE NIFTY 500 movers to frozen news coverage
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          day="$SESSION_DATE"
          if [ -z "$day" ]; then
            day="$(TZ=Asia/Kolkata date +%F)"
          fi
          python -m learning.mover_audit --session-date "$day"
      - name: Record immutable research observation evidence only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning/data/candidate_reports/
          if [ -d learning/data/mover_reports ]; then
            git add learning/data/mover_reports/
          fi
          if [ -f learning/data/candidate_outcomes.csv ]; then
            git add learning/data/candidate_outcomes.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record research-only frozen candidate EOD outcomes'
            git pull --no-rebase -X ours origin main
            git push origin HEAD:main
          fi
      - name: Train isolated challenger only if enough complete sessions
        run: python -m learning.train_candidates
      - name: Save challenger metrics without production deployment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-research-challenger-${{ github.run_id }}
          path: |
            learning/out_candidates/
            learning/data/candidate_reports/
            learning/data/mover_reports/
          if-no-files-found: ignore
          retention-days: 21
