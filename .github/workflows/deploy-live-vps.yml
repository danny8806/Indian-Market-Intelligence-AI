name: Deploy Kotak live-only dashboard to existing VPS

on:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'live_desk/**'
      - 'bridge/**'
      - 'scripts/validate_signals.py'
      - 'requirements-live.txt'
      - 'requirements-live-test.txt'
      - 'requirements-bridge.txt'
      - '.github/workflows/deploy-live-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotak-live-vps-monitoring
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application test requirements
        run: python -m pip install -r requirements-live-test.txt
      - name: Verify real-only signal and live supervisor regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python, browser JavaScript, deployment shell
        run: |
          python -m compileall -q live_desk bridge scripts
          node --check live_desk/static/app.js
          bash -n ops/deploy_live_vps.sh
          bash -n ops/activate_live_vps.sh
      - name: Deploy separate live-only service over pinned SSH (orders OFF)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          bash ops/deploy_live_vps.sh
          echo 'LIVE-ONLY MONITORING DEPLOYMENT: VPS local health and auth checks passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real Kotak orders remain DISABLED. Private HTTPS routing and real broker login not verified.' >> "$GITHUB_STEP_SUMMARY"
